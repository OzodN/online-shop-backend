server:
  port: 8080

spring:
  application:
    name: online-shop

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/onlineshop
    username: onlineshop
    password: onlineshop
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    schemas:
      - user_schema
      - product_schema
      - order_schema
      - review_schema
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    # 256-bit Base64-encoded secret key for HS256
    secret: ${JWT_SECRET:Yjxr57rmj4Kq6o89iGLzmojlydjRihN2i4gP5mYdmzr1NbAKuYHItVn5jHTwumLcB6T/xSVw2AoM1geNnxa19w==}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}       # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}   # 7 days

logging:
  level:
    root: info
    dev.ozodn.onlineshop: debug